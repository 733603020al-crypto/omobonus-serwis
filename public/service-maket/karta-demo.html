<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Демо карты (OpenStreetMap)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font:15px Lora,Georgia,serif;background:#f1dfb6;color:#312b1f}.w{max-width:760px;margin:0 auto;padding:16px}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid rgba(70,45,25,.55);border-radius:2px;font:inherit;background:transparent}
#s{border:1px solid rgba(70,45,25,.55);border-top:0;background:#f7ecd0}#s div{padding:8px 10px;cursor:pointer}#s div:hover{background:rgba(70,45,25,.1)}
#map{height:380px;margin-top:10px;border:1px solid rgba(70,45,25,.55)}#i{margin:8px 0;font-weight:600}</style></head><body><div class="w">
<h3>Adres dostawy — демо (OpenStreetMap, без Google)</h3>
<input id="q" placeholder="Zacznij wpisywać adres, np. Saperów 45 Wrocław" autocomplete="off"><div id="s"></div><div id="i"></div><div id="map"></div></div>
<script>
const HOME=[51.0990,17.0100];let t,rt,mk;
const map=L.map('map').setView(HOME,12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
L.marker(HOME).addTo(map).bindPopup('Omobonus serwis');
const q=document.getElementById('q'),s=document.getElementById('s');
q.oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{if(q.value.length<3){s.innerHTML='';return}
 const r=await(await fetch('https://photon.komoot.io/api/?limit=5&lang=en&lat=51.1&lon=17.03&q='+encodeURIComponent(q.value))).json();
 s.innerHTML='';r.features.filter(f=>f.properties.countrycode==='PL').forEach(f=>{const p=f.properties,d=document.createElement('div');
  d.textContent=[(p.street||p.name)+(p.housenumber?' '+p.housenumber:''),p.postcode,p.city].filter(Boolean).join(', ');d.onclick=()=>pick(d.textContent,f.geometry.coordinates);s.appendChild(d)})},300)};
async function pick(txt,c){q.value=txt;s.innerHTML='';const to=[c[1],c[0]];if(mk)map.removeLayer(mk);if(rt)map.removeLayer(rt);mk=L.marker(to).addTo(map);
 try{const r=await(await fetch('https://router.project-osrm.org/route/v1/driving/'+HOME[1]+','+HOME[0]+';'+c[0]+','+c[1]+'?overview=full&geometries=geojson')).json();const R=r.routes[0];
  rt=L.geoJSON(R.geometry,{style:{color:'#5a3a14',weight:5}}).addTo(map);map.fitBounds(rt.getBounds(),{padding:[30,30]});
  document.getElementById('i').textContent=(R.distance/1000).toFixed(1)+' km · ok. '+Math.round(R.duration/60)+' min'}catch(e){map.fitBounds([HOME,to],{padding:[30,30]});document.getElementById('i').textContent='маршрут недоступен'}}
</script></body></html>
