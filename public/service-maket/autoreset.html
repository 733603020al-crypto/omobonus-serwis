<!--
Макет AutoReset собирается из настоящей формы приёма (form.html), а не рисуется заново:
берётся вся страница формы целиком (шапка сайта, нижняя панель телефона, пергамент, заголовок,

четырёх шагов и логика. Настоящая функция переключения шагов showStep() и оформление
(блок SS … intakeRecess) выполняются из исходного текста form.html.
Правка form.html автоматически попадает и в этот макет. Операций с принтером нет — только демо-состояния.
-->

try{(0,eval)(slice("const pn=$('form');","new ResizeObserver(sc).observe(pn);sc();")+"new ResizeObserver(sc).observe(pn);sc();")}catch(e){console.error('sc',e)}

document.head.insertAdjacentHTML('beforeend','<style>.ar-abs{display:flex;align-items:center;gap:20px}.ar-absimg{position:relative;flex:none;width:120px;height:135px}.ar-absimg img{position:absolute;inset:0;width:100%;height:100%;opacity:0}.ar-absimg img:first-child{opacity:1}.ar-abst{flex:1;min-width:0}.ar-abst .ar-row{margin-top:0}body.phone .ar-absimg{width:84px;height:95px}body.phone .ar-abs{gap:14px}body.laptop .arg>li[data-i="1"]{align-items:center}body.laptop .arg{--abs-h:135px}body.laptop .arg>li .may-steps__connector{top:34px;bottom:0}body.laptop .arg>li[data-i="0"] .may-steps__connector{bottom:calc((34px - var(--abs-h))/2)}body.laptop .arg>li[data-i="1"] .may-steps__connector{top:calc((var(--abs-h) - 34px)/2 + 34px)}</style>');

{const ph=$('arPhotos'),im=MODELS[MODEL]||[];ph.classList.toggle('two',im.length>1);requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('ar-anim')));ph.innerHTML=im.slice(0,2).map(u=>'<img src="'+u+'" alt="'+MODEL+'">').join('')}

const fresh=()=>({model:'Epson L3250',pay:'',abs:96,step:1,scan:0,ok:false,code:'',pct:0,log:[],fail:false,res:'',absDone:false});
let S=fresh(),lead=V==='laptop',gotState=false,gotState0=false,tScan=null,tRun=null,lastStep=1;
