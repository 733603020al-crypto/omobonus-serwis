<!--
Макет AutoReset собирается из настоящей формы приёма (form.html), а не рисуется заново:
берётся вся страница формы целиком (шапка сайта, нижняя панель телефона, пергамент, заголовок,
полоса шагов, кнопки «Wstecz/Dalej», стили, подгонка размеров), заменяются только содержимое
четырёх шагов и логика. Настоящая функция переключения шагов showStep() и оформление
(блок SS … intakeRecess) выполняются из исходного текста form.html.
Правка form.html автоматически попадает и в этот макет. Операций с принтером нет — только демо-состояния.
-->

const SSa=form.indexOf('const SS=');const SSb=form.indexOf('`;document.head.appendChild(style)}',SSa);
try{(0,eval)(form.slice(SSa,SSb)+'`;document.head.appendChild(style)}')}catch(e){console.error('style block',e)}

try{(0,eval)(slice('let step=1;const NS=4;',"setOrg(false);applyLang();showStep(1);")+';window.__step=()=>step;')}catch(e){console.error('showStep',e)}
// 3) подгонка высоты пергамента под содержимое (ResizeObserver формы)
try{(0,eval)(slice("const pn=$('form');","new ResizeObserver(sc).observe(pn);sc();")+"new ResizeObserver(sc).observe(pn);sc();")}catch(e){console.error('sc',e)}

document.head.insertAdjacentHTML('beforeend','<style>.ar-abs{display:flex;align-items:center;gap:20px}.ar-absimg{position:relative;flex:none;width:120px;height:135px}.ar-absimg img{position:absolute;inset:0;width:100%;height:100%;opacity:0}.ar-absimg img:first-child{opacity:1}.ar-abst{flex:1;min-width:0}.ar-abst .ar-row{margin-top:0}body.phone .ar-absimg{width:84px;height:95px}body.phone .ar-abs{gap:14px}body.laptop .arg>li[data-i="1"]{align-items:center}body.laptop .arg{--abs-h:135px}body.laptop .arg>li .may-steps__connector{top:34px;bottom:0}body.laptop .arg>li[data-i="0"] .may-steps__connector{bottom:calc((34px - var(--abs-h))/2)}body.laptop .arg>li[data-i="1"] .may-steps__connector{top:calc((var(--abs-h) - 34px)/2 + 34px)}</style>');
document.head.insertAdjacentHTML('beforeend','<style>body.phone .inl{display:none}body.laptop .step{margin-top:0!important;padding-top:0!important;border-top:0!important}body.laptop .step:not(.hide){display:flex;flex-direction:column;min-height:276px}body.laptop .step>.inl{margin-top:auto!important;padding-top:var(--intake-gap-group)}body.phone .snav .b{white-space:normal;line-height:1.1;text-align:center}.ar-img{display:block;margin:0 auto var(--intake-gap-field);height:150px;max-width:100%;object-fit:contain}.ar-bar{height:16px;border:1px solid var(--intake-recess-border,#b9a77f);border-radius:8px;background:#fffdf8;overflow:hidden;box-shadow:var(--intake-recess-shadow,none)}.ar-bar i{display:block;height:100%;background:linear-gradient(#d9b072,#b68d60);transition:width .15s}#arBar1{transition:none;width:100%;background:linear-gradient(to right,#218B4E 0%,#83B84A 40%,#E9C43A 60%,#ED8838 80%,#C93632 100%)}.ar-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:var(--intake-gap-field) 0 2px}.ar-row label:last-child{white-space:nowrap;flex:none}.ar-big{font:700 44px var(--sfh);color:#3A2817;text-align:center;margin:var(--intake-gap-group) 0}.step button:disabled{opacity:.55;cursor:not-allowed}</style>');

try{SiteHeader.mount($('sh'),'pl',()=>{})}catch(e){console.error('header',e)}
document.querySelector('.ttl').textContent='Reset licznika absorbera';
const PL={ab1:'Napisz',ab2:'Mapa',ab3:'Zadzwoń'};
document.querySelectorAll('.abar [data-t]').forEach(e=>e.textContent=PL[e.dataset.t]||'');

// ---------- фото обнаруженной модели: только настоящие фото именно этой модели; нет фото — остаётся контур; два цвета — два принтера внахлёст
const MODEL='Epson L3250',MODELS={'Epson L3250':['../autoreset/printer-v1.webp']};
{const ph=$('arPhotos'),im=MODELS[MODEL]||[];ph.classList.toggle('two',im.length>1);requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('ar-anim')));ph.innerHTML=im.slice(0,2).map(u=>'<img src="'+u+'" alt="'+MODEL+'">').join('')}
// ---------- единое состояние макета (ПК и телефон) ----------
const fresh=()=>({model:'Epson L3250',pay:'',abs:96,step:1,scan:0,ok:false,code:'',pct:0,log:[],fail:false,res:'',absDone:false});
let S=fresh(),lead=V==='laptop',gotState=false,gotState0=false,tScan=null,tRun=null,lastStep=1;
const ch=new BroadcastChannel('autoreset');
const send=m=>ch.postMessage(m);
const bcast=()=>send({k:'state',S,lead:V});
const set=p=>{Object.assign(S,p);paint();bcast()};
let tAuto=null;const stop=()=>{clearInterval(tScan);clearInterval(tRun);clearTimeout(tAuto)};
const can2=()=>S.ok;const SUPPORTED=['Epson L3250'];const sup=()=>SUPPORTED.indexOf(S.model)>=0||!!S.demo; // S.demo — только явный режим симулятора программы; настоящие Epson проверяются по списку
const run=(c,a)=>{
 if(c==='rescan'){stop();set({step:1,scan:0,ok:false,code:'',pay:'',pct:0,log:[],res:'',absDone:false});tScan=setInterval(()=>{if(S.scan>=100){clearInterval(tScan);tAuto=setTimeout(()=>{if(lead&&S.step===1&&S.scan>=100&&sup())run('go1')},5500);return}set({scan:Math.min(100,S.scan+10)})},300)}
 else if(c==='go1'){if(S.step===1&&S.scan>=100&&sup())set({step:2})}
 else if(c==='back'){if(S.step===5&&S.res==='err')set({step:3,pay:'',pct:0,log:[],res:''})}
 else if(c==='ok'){if(S.step===2){set({ok:!!a});clearTimeout(tAuto);if(a)tAuto=setTimeout(()=>{if(S.step===2&&S.ok)set({step:3})},500)}}
 else if(c==='method'){if(S.step===3)set({pay:String(a)})}
 else if(c==='demo'){set({fail:!!a})}
 else if(c==='pay'){if(S.step!==3)return;stop();set({step:4,pct:0,log:['Płatność potwierdzona (symulacja)','Połączenie z symulatorem drukarki…']});

  tRun=setInterval(()=>{const p=Math.min(100,S.pct+5);
   if(S.fail&&p>=50){clearInterval(tRun);set({pct:p,log:S.log.concat('Błąd: utracono połączenie z drukarką'),step:5,res:'err'});return}
   set({pct:p,log:M[p]?S.log.concat(M[p]):S.log});
   if(p>=100){clearInterval(tRun);set({step:5,res:'check'});tAuto=setTimeout(()=>{if(lead&&S.step===5&&S.res==='check')set({res:'ok'})},1400)}},150)}
 else if(c==='again'){if(S.step===5&&S.res!=='check'){set(fresh());run('rescan')}}
};
const cmd=(c,a)=>lead?run(c,a):send({k:'cmd',c,a});
ch.onmessage=e=>{const m=e.data;
 if(m.k==='state'){if(lead&&!(V!=='laptop'&&m.lead==='laptop'))return;gotState=true;if(lead){lead=false;stop()}if(!gotState0&&m.S.scan>=100&&m.S.absDone)document.body.classList.add('ar-still');else if(m.S.scan===0)document.body.classList.remove('ar-still');gotState0=true;S=m.S;paint()}
 else if(m.k==='cmd'){if(lead)run(m.c,m.a)}
 else if(m.k==='hello'){if(lead)bcast()}};
